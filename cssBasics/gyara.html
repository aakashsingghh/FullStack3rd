<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div:has(h1){
            background-color: orange;
            box-shadow: 5px 5px 10px orange;
            
        }
        div:not(:has(h1)){
            background-color: green;
            box-shadow: 0px 5px 10px green;
        }
        h3{
            color: blue;
            text-align: center;
            font-size:100px;
            font-weight: bold;
            margin: 0px;
            padding: 0px;
            text-shadow: 5px 5px 30px blue;
            
        }
        h1{
            font-size: 100px;
            color: rgb(255, 115, 0);
            box-shadow: 0px 0px 10px orange;
        }
        h2{
            font-size: 100px;
            color: rgb(3, 179, 3);
            box-shadow: 0px 0px 10px green;
        }
    </style>
</head>
<body>
    <div>
        <h1>Heading 1</h1>
        
    </div>
    <h3>*</h3>
    <div>
        <h2>Heading 2</h2>

    </div>
</body>
</html>
