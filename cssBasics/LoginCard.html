<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .container{
            display:flex;
            justify-content: center ;
            text-align:center;
            align-items: center;
        }
        .container>.card{
            width: 300px;
            height: 400px;
            background-color: rgb(0, 0, 0);
            box-shadow: 5px 5px 10px black;
            border-radius: 10px;
            text-align: center;
            justify-content: center;
            
        }
        .submit{
            background-color: rgb(0, 0, 0);
            color: white;
            border-radius: 5px;
            padding: 10px;
            width: 100px;
            height: 40px;
        }
    </style>
</head>
<body>
    <div class = "container">
        <div class="card">
        <input type="text" placeholder="Username"><br><br>
        <input type="password" placeholder="Password"><br><br>
        <button type="submit">Login</button>
        </div>
    </div>
</body>
</html>
